apply plugin: 'com.android.application'

// --- Release signing ---------------------------------------------------------
// The key and the passwords live OUTSIDE the repo: ~/keys/happymath/keystore.properties
// (storeFile / storePassword / keyAlias / keyPassword). Nothing of it reaches git.
// The path can be overridden: -PhmKeystoreProps=/path/keystore.properties
//                      or env HM_KEYSTORE_PROPS=/path/keystore.properties
def hmKeystorePropsPath = project.findProperty('hmKeystoreProps') ?:
        System.getenv('HM_KEYSTORE_PROPS') ?:
        "${System.getProperty('user.home')}/keys/happymath/keystore.properties"
def hmKeystoreFile = file(hmKeystorePropsPath)
def hmKeystoreProps = new Properties()
def hmHasSigning = hmKeystoreFile.exists()
if (hmHasSigning) {
    hmKeystoreFile.withInputStream { hmKeystoreProps.load(it) }
} else {
    logger.warn("HappyMath: ${hmKeystorePropsPath} не найден — release соберётся БЕЗ подписи (в Play такой не примут).")
}

android {
    namespace = "ru.neyvan.hm"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.neyvan.hm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 201
        versionName "2.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hmHasSigning) {
            release {
                storeFile file(hmKeystoreProps['storeFile'])
                storePassword hmKeystoreProps['storePassword']
                keyAlias hmKeystoreProps['keyAlias']
                keyPassword hmKeystoreProps['keyPassword']
                // minSdk 24: the v1 (JAR) scheme is not needed, v2/v3 cover everything.
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hmHasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    // --- Build WITHOUT the INTERNET permission -------------------------------
    // The game is offline: all web content is loaded from assets through
    // WebViewAssetLoader (BridgeWebViewClient.shouldInterceptRequest ->
    // WebViewLocalServer), no network needed. But this can be verified ONLY on a
    // real device, so the permission stays by default. To build without it:
    //     ./gradlew assembleRelease -PhmNoInternet
    // The manifest overlay is merged over main and strips the uses-permission.
    if (project.hasProperty('hmNoInternet')) {
        sourceSets {
            release {
                manifest.srcFile 'src/no-internet/AndroidManifest.xml'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
